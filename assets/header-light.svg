<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Matteo Dante — Senior Software Engineer</title>
  <desc id="desc">A light cockpit-inspired GitHub profile header for Matteo Dante, senior software engineer based in Switzerland.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F3E8"/>
      <stop offset="0.55" stop-color="#F2E8D6"/>
      <stop offset="1" stop-color="#E7D7BE"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#087A93" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#087A93" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#087A93" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#21313D" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#grid)"/>
  <path d="M42 58H316M884 58h274M42 302h490M774 302h384" stroke="#B87515" stroke-opacity="0.82" stroke-width="2"/>
  <path d="M42 70H228M972 70h186M42 290h292M900 290h258" stroke="#087A93" stroke-opacity="0.42" stroke-width="1"/>

