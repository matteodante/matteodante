    <circle cx="273" cy="76" r="5" fill="#B87515" filter="url(#softGlow)"/>
    <circle cx="114" cy="205" r="4" fill="#087A93"/>
    <circle cx="216" cy="184" r="3" fill="#087A93" opacity="0.8"/>
