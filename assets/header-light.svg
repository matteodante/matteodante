  </g>

  <g transform="translate(74 78)">
    <text fill="#087A93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3">DANTE-1 · PORTFOLIO COCKPIT</text>
