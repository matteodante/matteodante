<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Matteo Dante systems console</title>
  <desc id="desc">A cockpit-style technology stack console showing frontend, backend, AI search, and delivery systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1118"/><stop offset="1" stop-color="#151A20"/></linearGradient>
    <style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui}.cream{fill:#F7F1E6}.muted{fill:#9EACB8}.cyan{fill:#7EE3F6}.gold{fill:#F7D88C}.panel{fill:#0C141C;stroke:#2B3A45}.bar{fill:#40C8E8}.bar2{fill:#F2B84B}</style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="mono cyan" font-size="18" letter-spacing="3">SYSTEMS CONSOLE</text><text x="48" y="87" class="sans cream" font-size="29" font-weight="760">Tools I actually reach for in production</text>
  <g transform="translate(48 126)"><rect class="panel" width="256" height="174" rx="16"/><text class="mono gold" x="22" y="34" font-size="14" letter-spacing="2">FRONTEND</text><text class="mono cream" x="22" y="72" font-size="15">React 19 · Next.js</text><text class="mono muted" x="22" y="104" font-size="14">Expo · microfrontends</text><text class="mono muted" x="22" y="136" font-size="14">Three.js · WebGL</text><rect x="22" y="150" width="196" height="6" rx="3" class="bar" opacity=".75"/></g>
  <g transform="translate(328 126)"><rect class="panel" width="256" height="174" rx="16"/><text class="mono gold" x="22" y="34" font-size="14" letter-spacing="2">BACKEND</text><text class="mono cream" x="22" y="72" font-size="15">Node · Hono · Laravel</text><text class="mono muted" x="22" y="104" font-size="14">.NET · Java · REST</text><text class="mono muted" x="22" y="136" font-size="14">Postgres · Redis · SQL</text><rect x="22" y="150" width="212" height="6" rx="3" class="bar2" opacity=".78"/></g>
  <g transform="translate(608 126)"><rect class="panel" width="256" height="174" rx="16"/><text class="mono gold" x="22" y="34" font-size="14" letter-spacing="2">AI / SEARCH</text><text class="mono cream" x="22" y="72" font-size="15">OpenAI · Anthropic</text><text class="mono muted" x="22" y="104" font-size="14">Agents · structured output</text><text class="mono muted" x="22" y="136" font-size="14">BM25 · RRF · reranking</text><rect x="22" y="150" width="205" height="6" rx="3" class="bar" opacity=".78"/></g>
  <g transform="translate(888 126)"><rect class="panel" width="256" height="174" rx="16"/><text class="mono gold" x="22" y="34" font-size="14" letter-spacing="2">DELIVERY</text><text class="mono cream" x="22" y="72" font-size="15">Docker · Turborepo</text><text class="mono muted" x="22" y="104" font-size="14">Vercel · Railway</text><text class="mono muted" x="22" y="136" font-size="14">On-prem · Sentry · OWASP</text><rect x="22" y="150" width="185" height="6" rx="3" class="bar2" opacity=".7"/></g>
  <path d="M48 328H1152" stroke="#2B3A45"/><text x="48" y="342" class="mono muted" font-size="13">NOTE: stack shown is based on real project/work history, not a keyword dump.</text>
</svg>
